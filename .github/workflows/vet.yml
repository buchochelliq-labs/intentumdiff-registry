name: Registry vetting

# The #95 PR gate — the registry is the root of trust, so every change to the
# manifest must pass schema + trust validation before merge.
on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

jobs:
  vet:
    name: Validate registry.yaml
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Install Python 3.12
        uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: "3.12"

      - name: Install PyYAML
        run: pip install "pyyaml>=6.0"

      - name: Schema + trust validation (vendored, dependency-free validator)
        run: python registry_schema.py registry.yaml

      - name: Catalog is up to date with the manifest
        run: |
          python registry_schema.py registry.yaml --catalog > /tmp/catalog.md
          diff -u CATALOG.md /tmp/catalog.md
